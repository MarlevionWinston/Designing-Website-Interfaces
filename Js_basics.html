<body>

    <script>
        // this is a JavaScriptt single-line comment                 
        /* this is a JavaScript multi-line comment
        The goal in this class is to comment nearly every line of code in the JavaScript code
        JavaScript is a scripting language - it exists to make our webpages more interactive
        JavaScript is a dynamically typed language - JavaScript will guess the type of your variables
        JavaScript uses the Document Object Model (DOM) to interact with the HTML elements on the page
        JavaScript and Java are entirely different languages - they just happen to have similar names
        
        4 key foundational components of  programming/scripting
        1) variables
        2) functions
        3) if/else (decision) logic
        4) loops
        
        1) Variables - a piece of code that allows us to store a value
        */

        // let is a JavaScript keyword that allows us to create a variable
        // then create a meaningful variable name
        // the single = sign is assignment - the code on the left hand side of the = sign will take on the value of the code on the right hand side of the = sign
        let myName = "Marlevion";

        // var is another way to create a variable in JavaScript
        // myname and myName are two different variables because JavaScript is case sensitive
        var myname = "marlevion";

        // there are different styles of variable names - for example camelCase - first word starts  with a lower case letter, 
        // other words start with a capital letter - for example: myPestsNameIs
        // snake_case - separate each word with an _

        // this is technically valid way to set up a variable in JavaScript, but please don't - use the keyword let when creating variables
        my_name = "Marlevion";

        // if you have a variable where the value should not change, use the keyword const; use UPPERCASE for the name of a constant variable to give other developers the context that the value does not change
        const PI = 3.14;

        /* 2) Functions - functions are awesome! They are a way of organizing our code and allow us to easily reuse our code

        there are 4 ways to use/write functions 

        when setting up a function use the function keyword

        */
       function showGreeting(){
        console.log("Hi CSC256");
       }

        // call the function we just wrote - use the function name + open and close parentheses
         showGreeting();    

        //  this function will display a greeting using a name that was passed in as a parameter/argument
        function displayGreeting(user_name){
            console.log("Hi " + user_name);
        }

        // call the function and pass in a value for the user_name
        displayGreeting("Marlevion"); // add the ; at the end nearly every line of JavaScript - because it is a good habit to have

        // create a function to add numbers together and return them
        function returnSum(){
            return 5 + 4;
        }

        // set the value that the fucntion returns to a variable called result
        let result = returnSum();

        console.log("result: " + result);

        // set up a function that takes 2 numbers as parameters and adds together and returns the sum
        function addNums(num1, num2){
            return num1 + num2;
        }

        // call the function
        result = addNums(3, 4);

        console.log("result: " + result);
    </script>
